<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente Fetch</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="contenedor">
    <h1>Libros</h1>

    <form id="form-buscar" class="formulario">
      <div class="campo">
        <label for="buscar-q">Texto</label>
        <input type="search" id="buscar-q" name="q" placeholder="soledad, orwell, 1984">
      </div>

      <div class="campo">
        <label for="buscar-autor">Autor</label>
        <input type="text" id="buscar-autor" name="autor" placeholder="Cervantes">
      </div>

      <div class="campo">
        <label for="buscar-editorial">Editorial</label>
        <input type="text" id="buscar-editorial" name="editorial">
      </div>

      <div class="campo">
        <label for="buscar-anio">Año</label>
        <input type="number" id="buscar-anio" name="año" step="1" placeholder="1605">
      </div>

      <div class="campo">
        <label for="buscar-limit">Máx. resultados</label>
        <input type="number" id="buscar-limit" name="limit" min="1" step="1" placeholder="sin límite">
      </div>

      <div class="campo campo--acciones">
        <button type="submit" class="boton">Buscar</button>
        <button type="button" id="ver-todos" class="boton boton--secundario">Ver todos los libros</button>
      </div>
    </form>

    <p id="mensaje" class="mensaje">Pulsa <strong>Buscar</strong> para filtrar, o <strong>Ver todos los libros</strong> para cargar el catálogo completo.</p>

    <p id="estado" class="estado" role="status" aria-live="polite" hidden></p>

    <ul id="lista-libros" class="grid"></ul>

    <aside id="detalle" class="detalle" hidden>
      <p id="detalle-estado" class="estado" role="status" aria-live="polite" hidden></p>

      <div id="detalle-contenido" hidden>
        <h2 id="detalle-titulo"></h2>
        <dl class="detalle__datos">
          <dt>Autor</dt>
          <dd id="detalle-autor"></dd>
          <dt>Editorial</dt>
          <dd id="detalle-editorial"></dd>
          <dt>Año</dt>
          <dd id="detalle-anio"></dd>
        </dl>
      </div>

      <button type="button" id="cerrar-detalle" class="boton">Cerrar</button>
    </aside>
  </main>

  <script src="js/main.js" charset="UTF-8"></script>
</body>
</html>
